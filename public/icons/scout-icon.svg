  <circle cx="64" cy="64" r="42" stroke="#00d4aa" stroke-width="3" fill="none" opacity=".28"/>
  <circle cx="64" cy="64" r="28" stroke="#00d4aa" stroke-width="5" fill="none" opacity=".75"/>
  <circle cx="64" cy="64" r="9" fill="#00d4aa"/>
  <line x1="64" y1="14" x2="64" y2="22" stroke="#00d4aa" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="106" x2="64" y2="114" stroke="#00d4aa" stroke-width="4" stroke-linecap="round"/>
  <line x1="14" y1="64" x2="22" y2="64" stroke="#00d4aa" stroke-width="4" stroke-linecap="round"/>
  <line x1="106" y1="64" x2="114" y2="64" stroke="#00d4aa" stroke-width="4" stroke-linecap="round"/>
</svg>
